[project]
name = "tieout-ai"
version = "0.1.0"
description = "AI TieOut: prove two business numbers agree. The AI proposes, code proves, people confirm."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "cryptography>=43",
    "mcp>=2.3",
    "numpy>=1.26",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "pydantic>=2.7",
    "sqlalchemy>=2.0",
    "sqlglot>=25",
    "typer>=0.12",
]

[project.scripts]
tieout = "tieout_ai.cli:app"
# `uvx tieout-ai ...` runs the command named after the package.
tieout-ai = "tieout_ai.cli:app"
tieout-mcp = "tieout_ai.mcp_server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "--strict-markers"]
pythonpath = ["tests", "."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# HTML/CSS template text; wrapping it would hurt readability of the markup.
"src/tieout_ai/render.py" = ["E501"]
